        d="M 235 315 L 295 315 L 274 262 L 235 262 Z" 
        fill="#E31B44" 
      />

      <!-- UPRIGHT 'r' IN DEEP NAVY -->
      <!-- Vertical pillar/stem with rounded corners -->
